<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" type="image/x-icon" href="download.png">
    <!-- bs cdn css 5.3  -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!-- bs icon cdn  -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.13.1/font/bootstrap-icons.min.css"
        integrity="sha512-t7Few9xlddEmgd3oKZQahkNI4dS6l80+eGEzFQiqtyVYdvcSG2D3Iub77R20BdotfRPA9caaRkg1tyaJiPmO0g=="
        crossorigin="anonymous" referrerpolicy="no-referrer">
    <style>
        .nav-color {
            background: linear-gradient(rgb(139, 161, 202), rgb(154, 173, 238));
        }

        footer {
            background: linear-gradient(rgb(139, 161, 202), rgb(154, 173, 238));
        }

        .dark {
            background-color: rgb(139, 161, 202);

        }

        .list {
            list-style: none;
        }
    </style>
</head>

<body>
    <!-- header  -->
    <nav class="navbar navbar-expand-lg sticky-top border border-dark border-2 nav-color" style="height: 100px;">
        <div class="container-fluid nav-color">
            <a class="navbar-brand text-body-secondary h1 fs-3" href="#">
                <img src="download.png" alt="Bootstrap" width="40" height="28" class="d-inline-block align-text-center">
                Barnes and Noble
            </a>
            <a id="b"><i class="bi bi-brightness-high-fill"></i></a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarScroll"
                aria-controls="navbarScroll" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarScroll">
                <ul class="navbar-nav fs-5 me-auto ms-auto my-2 my-lg-0 navbar-nav-scroll"
                    style="--bs-scroll-height: 100px;">
                    <li class="nav-item">
                        <a class="nav-link" aria-current="page" href="NAVBAR.html#hero">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#products">Products</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="contact.html">contact</a>
                    </li>
                </ul>
                <form class="d-flex" role="search">
                    <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search" />
                    <button class="btn btn-outline-dark" type="submit">Search</button>
                </form>
            </div>
        </div>
    </nav>
    <!-- contact form  -->
    <h1 class="text-center">CONTACT US</h1>
    <br>
    <div class="container">
        <div class="row">
            <!-- form  -->
            <div class="col-6 border p-2 mb-2 border-opacity-25 border-2 rounded-3 py-2">
                <form action="NAVBAR.html">
                    <!-- grid  -->
                    <div class="container">
                        <!-- row 1  -->
                        <div class="row mb-3">
                            <div class="col-6">
                                <label for="fn" class="form-label">First Name:</label>
                                <input type="text" placeholder="enter first name" id="fn" class="form-control" required>
                            </div>
                            <div class="col-6">
                                <label for="ln" class="form-label">Last Name:</label>
                                <input type="text" placeholder="enter last name" id="ln" class="form-control" required>
                            </div>
                        </div>
                        <!-- row 2  -->
                        <div class="row mb-3">
                            <div class="col-12">
                                <label for="mail" class="form-label">Enter Email Address:</label>
                                <input type="email" id="mail" placeholder="enter email address" required
                                    class="form-control">
                            </div>
                        </div>
                        <!-- row 3  -->
                        <div class="row mb-3">
                            <div class="col-12">
                                <label for="pass" class="form-label">Enter Password:</label>
                                <input type="password" id="pass" placeholder="enter your password" required
                                    class="form-control">
                            </div>
                        </div>
                        <!-- row 4  -->
                        <div class="row mb-3">
                            <label for="" class="form-label">Select Gender:</label>
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="gender" id="m" required>
                                <label class="form-check-label" for="m">
                                    Male
                                </label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="gender" id="f" checked required>
                                <label class="form-check-label" for="f">
                                    Female
                                </label>
                            </div>
                        </div>
                        <!-- row 5  -->
                        <div class="row mb-3">
                            <div class="col-12">
                                <label for="no" class="form-label">Enter Phone No.</label>
                                <input type="text" id="no" placeholder="enter your phone no." required
                                    class="form-control">
                            </div>
                        </div>
                        <!-- row 6  -->
                        <div class="row mb-3">
                            <button type="submit" class="btn btn-outline-primary">submit</button>
                        </div>
                    </div>
                </form>

            </div>
            <!-- map  -->
            <div class="col-6 py-auto ">
                <iframe
                    src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3616.5365715567095!2d67.0626927793457!3d24.981877199999985!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3eb340e584b891c3%3A0x29b2cbc198ba2dbd!2sAptech%20Computer%20Education%20North%20Karachi%20Center!5e0!3m2!1sen!2s!4v1789995584597!5m2!1sen!2s"
                    width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy"
                    referrerpolicy="strict-origin-when-cross-origin" class="pb-4"></iframe>
            </div>
        </div>
    </div>
    <br>
    <!-- footer  -->
    <footer class="container-fluid border border-dark border-1 p-3 align-content">
        <div class="row">
            <!-- column 1  -->
            <div class="col-12 col-md-6 col-lg-3 text-center">
                <a class="navbar-brand h1 fs-3 " href="#">
                    <img src="download.png" alt="Bootstrap" width="40" height="28"
                        class="d-inline-block align-text-center">
                    barnes and noble
                </a>
                <p class="text-center">a place for all your reading needs</p>
                <p class="text-center">© 2024 Barnes and Noble. All rights reserved.</p>
            </div>

            <!-- column 2  -->
            <div class="col-12 col-md-6 col-lg-3 text-center">
                <h3>Quick Links</h3>
                <ul class="fs-5 mx-auto  my-2 my-lg-0 list " style="--bs-scroll-height: 100px;">
                    <li class="nav-item">
                        <a class="nav-link" aria-current="page" href="NAVBAR.html#hero">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#products">Products</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="contact.html">Contact</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#about">about</a>
                    </li>
                </ul>
            </div>
            <!-- column 3  -->
            <div class="col-12 col-md-6 col-lg-3 text-center">
                <h3>Follow Us</h3>

                <div class="social-icons ">
                    <a href="#"><i class="fa-brands fa-facebook"></i></a>
                    <br>
                    <a href="#"><i class="fa-brands fa-instagram"></i></a>
                    <br>
                    <a href="#"><i class="fa-brands fa-twitter"></i></a>
                </div>
            </div>
            <div class="col-12 col-md-6 col-lg-3  text-center">
                <h3>Newsletter</h3>

                <input type="email" placeholder="Enter your email">
                <br>
                <br>
                <button class="btn-btn-primary button">Subscribe</button>
            </div>
        </div>


    </footer>

</body>

<script>
    $(document).ready(function () {
        $('#b').click(function () {
            $('body').toggleClass('dark');
        })
    })
</script>

</html>
